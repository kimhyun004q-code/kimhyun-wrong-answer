name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "김현수학_개인별오답생성기_HWPX초고속" `
            --collect-all tkinterdnd2 `
            --hidden-import lxml.etree `
            --paths src `
            src/app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\김현수학_개인별오답생성기_HWPX초고속.exe"
          if (-not (Test-Path $exe)) { throw "EXE build missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimhyun-wrong-answer-hwpx-fast
          path: dist/김현수학_개인별오답생성기_HWPX초고속.exe
          if-no-files-found: error
          retention-days: 30

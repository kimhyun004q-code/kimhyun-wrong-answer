name: Build ChatGPT HWPX EXE

on:
  push:
    branches:
      - chatgpt-build-hwpx-20260920
    paths:
      - "chatgpt_hwpx/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pymupdf

      - name: Restore HWPX template
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          $b64 = (Get-Content ".\direct_hwpx_template.b64.txt" -Raw).Trim()
          [IO.File]::WriteAllBytes(".\direct_hwpx_template.hwpx", [Convert]::FromBase64String($b64))
          if (-not (Test-Path ".\direct_hwpx_template.hwpx")) { throw "Template restore failed" }

      - name: Build EXE from source
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "GPT_HWPX_통합수식엔진" --add-data "direct_hwpx_template.hwpx;." ultrafast_app.py
          if (-not (Test-Path ".\dist\GPT_HWPX_통합수식엔진.exe")) { throw "EXE build missing" }

      - name: Smoke test EXE
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          @'
          [정답] ①
          [해설]
          집합 테스트 $S=\{1.5,\,3.5,\,6,\,8,\,9\}$.
          찌꺼기 테스트 $(B \cup W{xW})-A=W{1,6,xW}$.
          '@ | Set-Content -Path ".\test_input.txt" -Encoding utf8
          New-Item -ItemType Directory -Force -Path ".\test_out" | Out-Null
          $p = Start-Process -FilePath ".\dist\GPT_HWPX_통합수식엔진.exe" -ArgumentList @("--test-input",".\test_input.txt","--output-dir",".\test_out","--no-open","--validate") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE smoke test failed: $($p.ExitCode)" }
          $hwpx = Get-ChildItem ".\test_out\*.hwpx" | Select-Object -First 1
          if (-not $hwpx) { throw "No HWPX generated" }

      - name: Verify PyMuPDF is bundled for TikZ PNG conversion
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer -l ".\\dist\\GPT_HWPX_통합수식엔진.exe" | Out-File -FilePath ".\\archive_list.txt" -Encoding utf8
          $a = Get-Content ".\\archive_list.txt" -Raw
          if ($a -notmatch "fitz|pymupdf") { throw "PyMuPDF/fitz not bundled; TikZ PNG conversion would fail" }

      - name: Validate set equations and W cleanup
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          @'
          import zipfile, pathlib, sys
          files=list(pathlib.Path("test_out").glob("*.hwpx"))
          if not files:
              raise SystemExit("no hwpx")
          with zipfile.ZipFile(files[0]) as z:
              txt="\n".join(
                  z.read(n).decode("utf-8","ignore")
                  for n in z.namelist()
                  if n.endswith(".xml") or n.endswith(".hpf")
              )
          if "W{" in txt or "W}" in txt:
              raise SystemExit("stray W brace marker remains")
          if "<hp:equation" not in txt:
              raise SystemExit("math was not emitted as HWP equation objects")
          compact=txt.replace(" ","")
          if "leftlbrace1.5" not in compact or "9rightrbrace" not in compact:
              raise SystemExit("set S braces are not encoded as visible HWP equation braces")
          if "leftlbrace1,6,xrightrbrace" not in compact:
              raise SystemExit("W cleanup set braces failed")
          print("set equation validation ok")
          '@ | python -

      - name: Package artifact
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          New-Item -ItemType Directory -Force -Path ".\artifact" | Out-Null
          Copy-Item ".\dist\GPT_HWPX_통합수식엔진.exe" ".\artifact\GPT_HWPX_통합수식엔진.exe"
          Copy-Item ".\ultrafast_app.py" ".\artifact\ultrafast_app.py"
          Copy-Item ".\ultrafast_core.py" ".\artifact\ultrafast_core.py"
          Copy-Item ".\ultrafast_tikz.py" ".\artifact\ultrafast_tikz.py"
          Copy-Item (Get-ChildItem ".\test_out\*.hwpx" | Select-Object -First 1).FullName ".\artifact\검증용_집합표기.hwpx"
          Get-FileHash ".\artifact\GPT_HWPX_통합수식엔진.exe" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_통합수식엔진_20260920
          path: chatgpt_hwpx/artifact/*
          if-no-files-found: error
          retention-days: 30

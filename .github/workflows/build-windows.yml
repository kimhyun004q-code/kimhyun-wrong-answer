name: Build ChatGPT HWPX EXE

on:
  push:
    branches:
      - chatgpt-build-hwpx-20260920
    paths:
      - "chatgpt_hwpx/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pymupdf

      - name: Restore HWPX template
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          $b64 = (Get-Content ".\direct_hwpx_template.b64.txt" -Raw).Trim()
          [IO.File]::WriteAllBytes(".\direct_hwpx_template.hwpx", [Convert]::FromBase64String($b64))

      - name: Build final windowed EXE
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "GPT_HWPX_통합수식엔진" --add-data "direct_hwpx_template.hwpx;." ultrafast_app.py
          if (-not (Test-Path ".\dist\GPT_HWPX_통합수식엔진.exe")) { throw "final EXE missing" }

      - name: Build console smoke-test EXE
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name "GPT_HWPX_SMOKE" --add-data "direct_hwpx_template.hwpx;." ultrafast_app.py

      - name: Execute conversion smoke test
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          @'
          [정답] ①
          [해설]
          집합 테스트 $S=\{1.5,\,3.5,\,6,\,8,\,9\}$.
          집합 테스트 $B=\{1,3,6\}$.
          찌꺼기 테스트 $(B \cup W{xW})-A=W{1,6,xW}$.
          '@ | Set-Content -Path ".\test_input.txt" -Encoding utf8
          New-Item -ItemType Directory -Force -Path ".\test_out" | Out-Null
          & ".\dist\GPT_HWPX_SMOKE.exe" --test-input ".\test_input.txt" --output-dir ".\test_out" --no-open --validate
          if ($LASTEXITCODE -ne 0) { throw "conversion smoke test failed: $LASTEXITCODE" }
          if (-not (Get-ChildItem ".\test_out\*.hwpx" | Select-Object -First 1)) { throw "No HWPX generated" }

      - name: Verify final EXE contains PyMuPDF
        shell: pwsh
        working-directory: chatgpt_hwpx
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m PyInstaller.utils.cliutils.archive_viewer -l ".\dist\GPT_HWPX_통합수식엔진.exe" | Out-File ".\archive_list.txt" -Encoding utf8
          $a = Get-Content ".\archive_list.txt" -Raw
          if ($a -notmatch "pymupdf") { throw "PyMuPDF missing from final EXE" }

      - name: Validate set notation is HWP equation
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          @'
          import zipfile, pathlib, re
          f=next(pathlib.Path("test_out").glob("*.hwpx"))
          with zipfile.ZipFile(f) as z:
              sec=z.read("Contents/section0.xml").decode("utf-8","ignore")
          scripts=re.findall(r"<hp:script>(.*?)</hp:script>",sec,flags=re.S)
          c=["".join(x.split()) for x in scripts]
          assert any("S~=~leftlbrace1.5" in x and "9rightrbrace" in x for x in c), c
          assert any("B~=~leftlbrace1,3,6rightrbrace" in x for x in c), c
          assert any("leftlbrace1,6,xrightrbrace" in x for x in c), c
          assert "W{" not in sec and "W}" not in sec
          print("equation-set validation OK")
          '@ | python -

      - name: Package final artifact
        shell: pwsh
        working-directory: chatgpt_hwpx
        run: |
          New-Item -ItemType Directory -Force -Path ".\artifact" | Out-Null
          Copy-Item ".\dist\GPT_HWPX_통합수식엔진.exe" ".\artifact\GPT_HWPX_통합수식엔진.exe"
          Copy-Item ".\ultrafast_app.py" ".\artifact\ultrafast_app.py"
          Copy-Item ".\ultrafast_core.py" ".\artifact\ultrafast_core.py"
          Copy-Item ".\ultrafast_tikz.py" ".\artifact\ultrafast_tikz.py"
          Copy-Item (Get-ChildItem ".\test_out\*.hwpx" | Select-Object -First 1).FullName ".\artifact\검증용_집합수식.hwpx"

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_통합수식엔진_수식집합_TikZ복구_20260920
          path: chatgpt_hwpx/artifact/*
          if-no-files-found: error
          retention-days: 30

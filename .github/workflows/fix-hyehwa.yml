name: Fix Hyehwa HWPX

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_hyehwa_hwpx.py'
      - '.github/workflows/fix-hyehwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pillow lxml
      - name: Build corrected HWPX
        run: python tools/fix_hyehwa_hwpx.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyehwa-fixed
          path: |
            out/*.hwpx
            out/qa.txt
      - name: Commit corrected file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/*.hwpx out/qa.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build corrected Hyehwa HWPX"
            git push
          fi

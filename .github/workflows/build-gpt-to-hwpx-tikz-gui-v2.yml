name: Build GPT HWPX TikZ GUI v2

on:
  push:
    branches: [gpt-to-hwpx-build]
    paths:
      - '.github/workflows/build-gpt-to-hwpx-tikz-gui-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download current verified converter
        uses: actions/download-artifact@v4
        with:
          name: GPT_HWPX_GeometrySymbols_Windows
          path: prev
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35077164531

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pymupdf pillow

      - name: Recover app source from v1 workflow and patch test encoding
        shell: pwsh
        run: |
          $inner=(Get-ChildItem 'prev' -Recurse -Filter 'GPT_HWPX_원클릭_기하기호보정.exe' | Select-Object -First 1).FullName
          if(-not $inner){ throw 'verified inner EXE not found' }
          New-Item -ItemType Directory -Force -Path app | Out-Null
          Copy-Item $inner 'app/GPT_HWPX_원클릭_기하기호보정.exe' -Force
          Set-Content 'extract_blocks.py' -Encoding utf8 -Value @'
          from pathlib import Path
          import re, textwrap
          src=Path('.github/workflows/build-gpt-to-hwpx-tikz-gui.yml').read_text(encoding='utf-8')
          def grab(name):
              pat=rf"Set-Content 'app/{re.escape(name)}' -Encoding utf8 -Value @'\r?\n(.*?)\r?\n          '@"
              m=re.search(pat,src,re.S)
              if not m: raise SystemExit(f'block not found: {name}')
              return textwrap.dedent(m.group(1))+'\n'
          main=grab('main.py')
          main=main.replace("            print(n)\n            return 0", "            return 0")
          Path('app/main.py').write_text(main,encoding='utf-8')
          Path('app/sample.txt').write_text(grab('sample.txt'),encoding='utf-8')
          Path('app/check.py').write_text(grab('check.py'),encoding='utf-8')
          '@
          python extract_blocks.py
          python -m py_compile app/main.py app/check.py

      - name: Parser test
        shell: pwsh
        run: |
          python app/main.py --test-input app/sample.txt --parse-only
          if($LASTEXITCODE -ne 0){throw 'tag parser test failed'}

      - name: Build GUI EXE
        shell: pwsh
        run: |
          $inner=(Resolve-Path 'app/GPT_HWPX_원클릭_기하기호보정.exe').Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GPT_HWPX_수식_TikZ_자동조판 `
            --distpath dist --workpath build `
            --add-binary "$inner;." `
            --collect-all fitz `
            app/main.py

      - name: Create test PNG
        shell: pwsh
        run: |
          python -c "from PIL import Image,ImageDraw; im=Image.new('RGBA',(900,500),(255,255,255,0)); d=ImageDraw.Draw(im); d.ellipse((50,50,850,450),outline=(0,0,0,255),width=5); im.save('app/test.png')"

      - name: End-to-end HWPX test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $p=Start-Process '.\dist\GPT_HWPX_수식_TikZ_자동조판.exe' -ArgumentList @('--test-input','app/sample.txt','--output-dir','out','--no-open','--test-png','app/test.png') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "EXE exit $($p.ExitCode)"}
          $o=Get-ChildItem 'out\*.hwpx'|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if($null -eq $o){throw 'HWPX not created'}
          python -m zipfile -t $o.FullName
          if($LASTEXITCODE -ne 0){throw 'ZIP integrity failed'}
          python app/check.py $o.FullName
          if($LASTEXITCODE -ne 0){throw 'HWPX TikZ regression failed'}
          Copy-Item $o.FullName 'out/GPT_HWPX_수식_TikZ_테스트.hwpx' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_TikZ_GUI_Windows_v2
          path: |
            dist/GPT_HWPX_수식_TikZ_자동조판.exe
            out/GPT_HWPX_수식_TikZ_테스트.hwpx
          if-no-files-found: error
          retention-days: 7

name: Build GPT to HWPX V3.2 Windows EXE

on:
  push:
    branches:
      - gpt-to-hwpx-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct V3.2 source and template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'gpt_to_hwpx_v32' | Out-Null
          $src64 = ''
          Get-ChildItem 'gpt_to_hwpx_build/v32gz_*.b64' | Sort-Object Name | ForEach-Object { $src64 += Get-Content $_.FullName -Raw }
          Set-Content -Path 'gpt_to_hwpx_v32/source.py.gz.b64' -Value $src64 -Encoding ascii -NoNewline
          python -c "import base64,gzip,pathlib; p=pathlib.Path('gpt_to_hwpx_v32/source.py.gz.b64'); pathlib.Path('gpt_to_hwpx_v32/gpt_to_hwpx_v32.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          $sha = (Get-FileHash 'gpt_to_hwpx_v32/gpt_to_hwpx_v32.py' -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '84c007e8b72b4a37d5a06cf45792acee81db3b1b5601081a4eaaff1049558c24') { throw "V3.2 source SHA mismatch: $sha" }

          $tpl = ''
          Get-ChildItem 'gpt_to_hwpx_build/template_*.b64' | Sort-Object Name | ForEach-Object { $tpl += Get-Content $_.FullName -Raw }
          [IO.File]::WriteAllBytes('gpt_to_hwpx_v32/direct_hwpx_template.hwpx', [Convert]::FromBase64String($tpl))

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Create clipboard-style regression sample
        shell: pwsh
        run: |
          Set-Content -Path 'gpt_to_hwpx_v32/clipboard_sample.md' -Encoding utf8 -Value @'
          정답은 `\boxed{55}`가지입니다.

          학생 `A,B,C`가 받는 공의 총개수를 각각

          $$
          a,b,c
          $$

          라 하면

          $$
          a+b+c=8
          $$

          이고, 조건에 의해

          $$
          a\ge2,\qquad b\ge a,\qquad b\ge c
          $$

          입니다.

          이 조건을 만족하는 `(a,b,c)`는

          $$
          \begin{array}{c} (2,3,3),\ (2,4,2),\ (2,5,1),\ (2,6,0),\\ (3,3,2),\ (3,4,1),\ (3,5,0),\ (4,4,0) \end{array}
          $$

          각 경우를 세면

          $$
          \begin{array}{c|c} (a,b,c)&\text{경우의 수}\\ \hline (2,3,3)&10\\ (2,4,2)&9\\ (2,5,1)&6\\ (2,6,0)&3\\ (3,3,2)&10\\ (3,4,1)&8\\ (3,5,0)&4\\ (4,4,0)&5 \end{array}
          $$

          $$
          \boxed{55}
          $$
          '@

          Set-Content -Path 'gpt_to_hwpx_v32/check_v32.py' -Encoding utf8 -Value @'
          import sys,zipfile,xml.etree.ElementTree as E
          ns={'hp':'http://www.hancom.co.kr/hwpml/2011/paragraph'}
          with zipfile.ZipFile(sys.argv[1]) as z:
              root=E.fromstring(z.read('Contents/section0.xml'))
          texts=[(x.text or '') for x in root.findall('.//hp:t',ns)]
          scripts=[(x.text or '') for x in root.findall('.//hp:equation/hp:script',ns)]
          plain='\n'.join(texts)
          bad_plain=('$$','\\begin','\\end','\\ge','\\le','\\qquad','\\text','```')
          assert not any(x in plain for x in bad_plain), plain
          assert len(scripts)>=8, scripts
          assert any(x.startswith('matrix{') for x in scripts), scripts
          assert any('"경우의 수"' in x for x in scripts), scripts
          assert any('a >= 2' in x and 'b >= a' in x for x in scripts), scripts
          assert not any('box {' in x for x in scripts), scripts
          assert not any('\\' in x for x in scripts), scripts
          print('V3.2 clipboard regression OK',len(scripts))
          '@

      - name: Smoke test Python V3.2 converter
        shell: pwsh
        run: |
          python gpt_to_hwpx_v32/gpt_to_hwpx_v32.py --cli gpt_to_hwpx_v32/clipboard_sample.md gpt_to_hwpx_v32/smoke.hwpx
          if ($LASTEXITCODE -ne 0) { throw "Python V3.2 converter exited with $LASTEXITCODE" }
          python -m zipfile -t gpt_to_hwpx_v32/smoke.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'Python V3.2 HWPX ZIP integrity check failed' }
          python gpt_to_hwpx_v32/check_v32.py gpt_to_hwpx_v32/smoke.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'Python V3.2 clipboard regression failed' }

      - name: Build single V3.2 EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GPT_to_HWPX_V3_2 `
            --add-data 'gpt_to_hwpx_v32/direct_hwpx_template.hwpx;.' `
            gpt_to_hwpx_v32/gpt_to_hwpx_v32.py

      - name: Smoke test V3.2 EXE converter
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\GPT_to_HWPX_V3_2.exe' `
            -ArgumentList @('--cli', 'gpt_to_hwpx_v32/clipboard_sample.md', 'gpt_to_hwpx_v32/smoke_exe.hwpx') `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "V3.2 EXE converter exited with $($p.ExitCode)" }
          if (!(Test-Path 'gpt_to_hwpx_v32/smoke_exe.hwpx')) { throw 'V3.2 EXE smoke test failed: HWPX not created' }
          python -m zipfile -t gpt_to_hwpx_v32/smoke_exe.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'V3.2 EXE HWPX ZIP integrity check failed' }
          python gpt_to_hwpx_v32/check_v32.py gpt_to_hwpx_v32/smoke_exe.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'V3.2 EXE clipboard regression failed' }

      - name: Upload Windows V3.2 EXE and sample
        uses: actions/upload-artifact@v4
        with:
          name: GPT_to_HWPX_V3_2_Windows
          path: |
            dist/GPT_to_HWPX_V3_2.exe
            gpt_to_hwpx_v32/smoke_exe.hwpx
          if-no-files-found: error
          retention-days: 7

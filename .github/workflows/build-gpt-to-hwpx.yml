name: Build GPT to HWPX V2 Windows EXE

on:
  push:
    branches:
      - gpt-to-hwpx-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct V2 source and template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'gpt_to_hwpx_v2' | Out-Null
          python -c "import base64,gzip,pathlib; p=pathlib.Path('gpt_to_hwpx_v2/source.py.gz.b64'); pathlib.Path('gpt_to_hwpx_v2/gpt_to_hwpx_v2.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"

          $tpl = ''
          Get-ChildItem 'gpt_to_hwpx_build/template_*.b64' | Sort-Object Name | ForEach-Object { $tpl += Get-Content $_.FullName -Raw }
          [IO.File]::WriteAllBytes('gpt_to_hwpx_v2/direct_hwpx_template.hwpx', [Convert]::FromBase64String($tpl))

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Create regression sample
        shell: pwsh
        run: |
          Set-Content -Path 'gpt_to_hwpx_v2/sample.txt' -Encoding utf8 -Value @'
          [해설]
          삼각형 $\triangle ABC$에서 $\overline{AB}=6$, $\overline{AC}=8$, $\angle A=120^\circ$이다.
          $$\overline{BC}^2=6^2+8^2-2\cdot 6\cdot 8\cos 120^\circ$$
          따라서 $\overline{BC}=2\sqrt{37}$이다.
          분수는 $\frac{1}{2}$이고, 극한은 $\lim_{x\to\infty}\frac{f(x)}{2x^2+1}=3$이다.
          합은 $\sum_{k=1}^{10}a_k$, 적분은 $\int_0^1 f(x)\,dx$이다.
          조합은 $\binom{5}{2}=10$이다.
          집합은 $A\cap B\ne\emptyset$이고 $3\notin A$이다.
          괄호는 $\left(\frac{1}{2}\right)^x$이다.
          '@

      - name: Smoke test Python V2 converter
        shell: pwsh
        run: |
          python gpt_to_hwpx_v2/gpt_to_hwpx_v2.py --convert gpt_to_hwpx_v2/sample.txt gpt_to_hwpx_v2/smoke.hwpx
          if ($LASTEXITCODE -ne 0) { throw "Python converter exited with $LASTEXITCODE" }
          python -m zipfile -t gpt_to_hwpx_v2/smoke.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'Python HWPX ZIP integrity check failed' }
          python -c "import zipfile,xml.etree.ElementTree as E; ns={'hp':'http://www.hancom.co.kr/hwpml/2011/paragraph'}; z=zipfile.ZipFile('gpt_to_hwpx_v2/smoke.hwpx'); r=E.fromstring(z.read('Contents/section0.xml')); s=[(x.text or '') for x in r.findall('.//hp:equation/hp:script',ns)]; req=['{bar {rm BC it}} ^{2}','{1} over {2}','lim _{x rarrow INF','sum _{k=1}','{}_{5} rm C','LEFT ( {1} over {2} RIGHT ) ^{x}']; assert all(any(q in x for x in s) for q in req), s; print('Regression scripts OK:',len(s))"

      - name: Build single V2 EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GPT_to_HWPX_V2 `
            --add-data 'gpt_to_hwpx_v2/direct_hwpx_template.hwpx;.' `
            gpt_to_hwpx_v2/gpt_to_hwpx_v2.py

      - name: Smoke test V2 EXE converter
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\GPT_to_HWPX_V2.exe' `
            -ArgumentList @('--convert', 'gpt_to_hwpx_v2/sample.txt', 'gpt_to_hwpx_v2/smoke_exe.hwpx') `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE converter exited with $($p.ExitCode)" }
          if (!(Test-Path 'gpt_to_hwpx_v2/smoke_exe.hwpx')) { throw 'EXE smoke test failed: HWPX not created' }
          python -m zipfile -t gpt_to_hwpx_v2/smoke_exe.hwpx
          if ($LASTEXITCODE -ne 0) { throw 'EXE HWPX ZIP integrity check failed' }

      - name: Upload Windows V2 EXE
        uses: actions/upload-artifact@v4
        with:
          name: GPT_to_HWPX_V2_Windows
          path: dist/GPT_to_HWPX_V2.exe
          if-no-files-found: error
          retention-days: 7

name: Build GPT HWPX One Click Windows EXE

on:
  push:
    branches: [gpt-to-hwpx-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified V3.2 converter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'gpt_to_hwpx_v32' | Out-Null
          $src64 = ''
          Get-ChildItem 'gpt_to_hwpx_build/v3gz_*.b64' | Sort-Object Name | ForEach-Object { $src64 += Get-Content $_.FullName -Raw }
          Set-Content 'gpt_to_hwpx_v32/source.py.gz.b64' $src64 -Encoding ascii -NoNewline
          python -c "import base64,gzip,pathlib; p=pathlib.Path('gpt_to_hwpx_v32/source.py.gz.b64'); pathlib.Path('gpt_to_hwpx_v32/gpt_to_hwpx_v32.py').write_bytes(gzip.decompress(base64.b64decode(p.read_text())))"
          Set-Content 'gpt_to_hwpx_v32/patch.py' -Encoding utf8 -Value @'
          from pathlib import Path
          p=Path('gpt_to_hwpx_v32/gpt_to_hwpx_v32.py')
          s=p.read_text(encoding='utf-8')
          a="lambda cmd,a: 'box {'+latex_to_hwp(a[0])+'}')"
          b="lambda cmd,a: latex_to_hwp(a[0]))"
          if a not in s: raise SystemExit('boxed patch target not found')
          s=s.replace(a,b,1)
          marker="        fm=re.match(r'^\\s*```\\s*([A-Za-z0-9_+-]*)\\s*$', line)"
          if marker not in s: raise SystemExit('parse marker not found')
          ins=(
              "        stripped=line.strip()\n\n"
              "        if stripped in ('$$', r'\\\\['):\n"
              "            closer = '$$' if stripped == '$$' else r'\\\\]'\n"
              "            content=[]; i+=1\n"
              "            while i<len(lines) and lines[i].strip()!=closer:\n"
              "                content.append(lines[i]); i+=1\n"
              "            if i<len(lines) and lines[i].strip()==closer: i+=1\n"
              "            raw='\\n'.join(content).strip()\n"
              "            if raw: blocks.append(('display_math',raw))\n"
              "            continue\n\n"
          )
          s=s.replace(marker,ins+marker,1)
          p.write_text(s,encoding='utf-8')
          '@
          python gpt_to_hwpx_v32/patch.py
          python -m py_compile gpt_to_hwpx_v32/gpt_to_hwpx_v32.py
          $tpl=''
          Get-ChildItem 'gpt_to_hwpx_build/template_*.b64' | Sort-Object Name | ForEach-Object { $tpl += Get-Content $_.FullName -Raw }
          [IO.File]::WriteAllBytes('gpt_to_hwpx_v32/direct_hwpx_template.hwpx',[Convert]::FromBase64String($tpl))

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Create sample
        shell: pwsh
        run: |
          Set-Content 'gpt_to_hwpx_v32/sample.md' -Encoding utf8 -Value @'
          정답은 `\boxed{55}`가지입니다.

          함수값은 다음과 같습니다.

          $$
          m=f\left(-\frac{13}{12}\right)
          $$

          조건은

          $$
          a\ge2,\qquad b\ge a,\qquad b\ge c
          $$

          입니다.
          '@

      - name: Build hidden V3.2 converter EXE
        shell: pwsh
        run: |
          $tpl=(Resolve-Path 'gpt_to_hwpx_v32/direct_hwpx_template.hwpx').Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GPT_to_HWPX_V3_2 `
            --distpath dist_converter `
            --workpath build_converter `
            --add-data "$tpl;." `
            gpt_to_hwpx_v32/gpt_to_hwpx_v32.py

      - name: Create one-click launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oneclick | Out-Null
          Set-Content 'oneclick/launcher.py' -Encoding utf8 -Value @'
          import ctypes,os,re,subprocess,sys,tempfile,time,winreg,zipfile
          from datetime import datetime
          from pathlib import Path

          CF_UNICODETEXT=13
          CREATE_NO_WINDOW=0x08000000
          u=ctypes.windll.user32
          k=ctypes.windll.kernel32
          u.OpenClipboard.argtypes=[ctypes.c_void_p]; u.OpenClipboard.restype=ctypes.c_bool
          u.CloseClipboard.argtypes=[]; u.CloseClipboard.restype=ctypes.c_bool
          u.GetClipboardData.argtypes=[ctypes.c_uint]; u.GetClipboardData.restype=ctypes.c_void_p
          k.GlobalLock.argtypes=[ctypes.c_void_p]; k.GlobalLock.restype=ctypes.c_void_p
          k.GlobalUnlock.argtypes=[ctypes.c_void_p]; k.GlobalUnlock.restype=ctypes.c_bool

          def msg(t):
              u.MessageBoxW(None,t,'GPT → HWPX',0x10)

          def clip():
              for _ in range(10):
                  if u.OpenClipboard(None):
                      try:
                          h=u.GetClipboardData(CF_UNICODETEXT)
                          if not h:return ''
                          p=k.GlobalLock(h)
                          if not p:return ''
                          try:return ctypes.wstring_at(p)
                          finally:k.GlobalUnlock(h)
                      finally:u.CloseClipboard()
                  time.sleep(.08)
              return ''

          def desktop():
              try:
                  q=winreg.OpenKey(winreg.HKEY_CURRENT_USER,r'Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders')
                  v,_=winreg.QueryValueEx(q,'Desktop'); winreg.CloseKey(q)
                  return Path(os.path.expandvars(v))
              except:
                  return Path.home()/'Desktop'

          def resource(n):
              return Path(getattr(sys,'_MEIPASS',Path(__file__).resolve().parent))/n

          def outname(folder):
              s=datetime.now().strftime('%Y%m%d_%H%M%S')
              p=folder/f'GPT해설_{s}.hwpx'
              if not p.exists():return p
              return folder/f'GPT해설_{s}_{os.getpid()}.hwpx'

          def clean_section(xml_text):
              def clean_script(m):
                  body=re.sub(r'(?i)(?:LEFT|RIGHT)\s*','',m.group(2))
                  return m.group(1)+body+m.group(3)
              xml_text=re.sub(r'(<hp:script>)(.*?)(</hp:script>)',clean_script,xml_text,flags=re.S)

              spacer=re.compile(
                  r'<hp:p\b[^>]*>\s*<hp:run\b[^>]*>\s*'
                  r'(?:<hp:t\b[^>]*/>|<hp:t\b[^>]*>\s*</hp:t>)\s*'
                  r'</hp:run>\s*</hp:p>',
                  re.S,
              )
              xml_text=spacer.sub('',xml_text)
              return xml_text

          def postprocess_hwpx(path):
              with zipfile.ZipFile(path,'r') as zin:
                  items=[(info,zin.read(info.filename)) for info in zin.infolist()]
              tmp=path.with_suffix('.tmp.hwpx')
              try:
                  with zipfile.ZipFile(tmp,'w') as zout:
                      for info,data in items:
                          if info.filename.startswith('Contents/section') and info.filename.endswith('.xml'):
                              text=data.decode('utf-8')
                              data=clean_section(text).encode('utf-8')
                          zout.writestr(info,data)
                  os.replace(tmp,path)
              finally:
                  if tmp.exists():
                      try:tmp.unlink()
                      except:pass

          def convert(text,out):
              exe=resource('GPT_to_HWPX_V3_2.exe')
              if not exe.exists():raise RuntimeError('내부 변환기를 찾지 못했습니다.')
              with tempfile.TemporaryDirectory(prefix='gpt_hwpx_') as td:
                  f=Path(td)/'clipboard.md'
                  f.write_text(text,encoding='utf-8')
                  si=subprocess.STARTUPINFO(); si.dwFlags|=subprocess.STARTF_USESHOWWINDOW
                  r=subprocess.run([str(exe),'--cli',str(f),str(out)],startupinfo=si,creationflags=CREATE_NO_WINDOW,timeout=120)
                  if r.returncode or not out.exists():
                      raise RuntimeError(f'HWPX 변환에 실패했습니다. (코드 {r.returncode})')
              postprocess_hwpx(out)

          def main():
              a=sys.argv[1:]; test=None; od=None; noopen=False; i=0
              while i<len(a):
                  if a[i]=='--test-input' and i+1<len(a):test=Path(a[i+1]);i+=2;continue
                  if a[i]=='--output-dir' and i+1<len(a):od=Path(a[i+1]);i+=2;continue
                  if a[i]=='--no-open':noopen=True;i+=1;continue
                  i+=1
              try:
                  text=test.read_text(encoding='utf-8-sig') if test else clip()
                  if not text.strip():
                      msg('ChatGPT 답변을 먼저 복사(Ctrl+C)한 뒤 다시 실행해주세요.')
                      return 2
                  folder=od if od else desktop()/'GPT_HWPX'
                  folder.mkdir(parents=True,exist_ok=True)
                  out=outname(folder)
                  convert(text,out)
                  if not noopen:os.startfile(str(out))
                  return 0
              except Exception as e:
                  msg(str(e));return 1

          if __name__=='__main__':raise SystemExit(main())
          '@
          python -m py_compile oneclick/launcher.py

          Set-Content 'oneclick/check_final.py' -Encoding utf8 -Value @'
          import re,sys,zipfile,xml.etree.ElementTree as E
          path=sys.argv[1]
          ns={'hp':'http://www.hancom.co.kr/hwpml/2011/paragraph'}
          with zipfile.ZipFile(path) as z:
              sec=z.read('Contents/section0.xml').decode('utf-8')
              root=E.fromstring(sec.encode('utf-8'))
          scripts=[x.text or '' for x in root.findall('.//hp:equation/hp:script',ns)]
          assert scripts, 'no equations'
          assert not any('LEFT' in s.upper() or 'RIGHT' in s.upper() for s in scripts),scripts
          assert any('13' in s and '12' in s and '(' in s and ')' in s for s in scripts),scripts
          spacer=re.compile(r'<hp:p\b[^>]*>\s*<hp:run\b[^>]*>\s*(?:<hp:t\b[^>]*/>|<hp:t\b[^>]*>\s*</hp:t>)\s*</hp:run>\s*</hp:p>',re.S)
          assert not spacer.search(sec), 'blank spacer paragraph remains'
          print('FINAL OK',scripts)
          '@

      - name: Build one-click desktop EXE
        shell: pwsh
        run: |
          $conv=(Resolve-Path 'dist_converter/GPT_to_HWPX_V3_2.exe').Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GPT_HWPX_원클릭 `
            --distpath dist_oneclick `
            --workpath build_oneclick `
            --add-binary "$conv;." `
            oneclick/launcher.py

      - name: Smoke test one-click end to end
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oneclick_test | Out-Null
          $p=Start-Process '.\dist_oneclick\GPT_HWPX_원클릭.exe' -ArgumentList @('--test-input','gpt_to_hwpx_v32/sample.md','--output-dir','oneclick_test','--no-open') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "oneclick exit $($p.ExitCode)"}
          $out=Get-ChildItem 'oneclick_test\*.hwpx'|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if($null -eq $out){throw 'HWPX not created'}
          python -m zipfile -t $out.FullName
          if($LASTEXITCODE -ne 0){throw 'HWPX ZIP check failed'}
          python oneclick/check_final.py $out.FullName
          if($LASTEXITCODE -ne 0){throw 'final LEFT/RIGHT or spacing regression failed'}
          Copy-Item $out.FullName 'oneclick_test\GPT_HWPX_원클릭_테스트.hwpx' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_OneClick_Windows
          path: |
            dist_oneclick/GPT_HWPX_원클릭.exe
            oneclick_test/GPT_HWPX_원클릭_테스트.hwpx
          if-no-files-found: error
          retention-days: 7

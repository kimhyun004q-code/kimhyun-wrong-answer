name: Build Combined Score + Wrong Answer EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'combined/**'
      - 'src/excel_reader.py'
      - 'src/hwpx_direct.py'
      - '.github/workflows/build-combined.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.15.0 openpyxl==3.1.5 lxml olefile Pillow playwright tkinterdnd2==0.4.3
          # 안정판은 Windows에 기본 설치된 Edge를 사용하므로 Chromium을 EXE에 넣지 않습니다.

      - name: Keep A4 landscape for generated HWPX
        shell: pwsh
        run: |
          $path = "src/hwpx_direct.py"
          $text = Get-Content $path -Raw -Encoding UTF8
          $text = $text.Replace('page_pr.set("landscape", "NARROWLY")', 'page_pr.set("landscape", "WIDELY")')
          Set-Content $path -Value $text -Encoding UTF8
          if ((Get-Content $path -Raw -Encoding UTF8) -notmatch 'page_pr\.set\("landscape", "WIDELY"\)') {
            throw "A4 portrait patch failed"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "김현수학_통합관리_A4" `
            --paths "src" `
            --paths "combined" `
            --collect-all tkinterdnd2 `
            --collect-all playwright `
            --hidden-import PIL._tkinter_finder `
            --hidden-import olefile `
            --add-data "combined/score/run3.py;score" `
            --add-data "combined/score/report3.py;score" `
            --add-data "combined/score/report4.py;score" `
            --add-data "combined/score/parse.py;score" `
            --add-data "combined/score/parse4.py;score" `
            --add-data "combined/score/discover.py;score" `
            --add-data "combined/score/build_xlsx.py;score" `
            --exclude-module pandas `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --exclude-module torch `
            --exclude-module tensorflow `
            --exclude-module sklearn `
            --exclude-module cv2 `
            --exclude-module transformers `
            --exclude-module sympy `
            --exclude-module IPython `
            --exclude-module notebook `
            --exclude-module pytest `
            "combined/combined_app.py"

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse | Select-Object FullName,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimhyun-combined-a4-windows
          path: dist/김현수학_통합관리_A4.exe
          retention-days: 30
          if-no-files-found: error

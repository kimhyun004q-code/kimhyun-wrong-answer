name: Build Full Handoff Package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-handoff.yml'

jobs:
  handoff:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.15.0 openpyxl==3.1.5 lxml olefile Pillow playwright tkinterdnd2==0.4.3
          # 전송안정판은 Windows에 기본 설치된 Edge/Chrome을 사용하므로 Chromium을 EXE에 넣지 않습니다.

      - name: Force A4 portrait for generated HWPX
        shell: pwsh
        run: |
          $path = "src/hwpx_direct.py"
          $text = Get-Content $path -Raw -Encoding UTF8
          $text = $text.Replace('page_pr.set("landscape", "NARROWLY")', 'page_pr.set("landscape", "WIDELY")')
          Set-Content $path -Value $text -Encoding UTF8
          if ((Get-Content $path -Raw -Encoding UTF8) -notmatch 'page_pr\.set\("landscape", "WIDELY"\)') {
            throw "A4 portrait patch failed"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "김현수학_통합성적표_오답생성기" `
            --paths "src" `
            --paths "combined" `
            --collect-all tkinterdnd2 `
            --collect-all playwright `
            --hidden-import PIL._tkinter_finder `
            --hidden-import olefile `
            --add-data "combined/score/run3.py;score" `
            --add-data "combined/score/report3.py;score" `
            --add-data "combined/score/report4.py;score" `
            --add-data "combined/score/parse.py;score" `
            --add-data "combined/score/parse4.py;score" `
            --add-data "combined/score/discover.py;score" `
            --add-data "combined/score/build_xlsx.py;score" `
            --exclude-module pandas `
            --exclude-module numpy `
            --exclude-module scipy `
            --exclude-module matplotlib `
            --exclude-module torch `
            --exclude-module tensorflow `
            --exclude-module sklearn `
            --exclude-module cv2 `
            --exclude-module transformers `
            --exclude-module sympy `
            --exclude-module IPython `
            --exclude-module notebook `
            --exclude-module pytest `
            "combined/combined_app.py"

      - name: Assemble handoff package
        shell: pwsh
        run: |
          $root = "handoff"
          $src = Join-Path $root "02_전체소스코드"
          New-Item -ItemType Directory -Force -Path "$root/01_최신실행파일" | Out-Null
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Copy-Item "dist/김현수학_통합성적표_오답생성기.exe" "$root/01_최신실행파일/김현수학_통합성적표_오답생성기.exe"
          Copy-Item "combined" "$src/combined" -Recurse
          Copy-Item "src" "$src/src" -Recurse
          New-Item -ItemType Directory -Force -Path "$src/.github/workflows" | Out-Null
          Copy-Item ".github/workflows/build-combined.yml" "$src/.github/workflows/build-combined.yml"
          Copy-Item ".github/workflows/build-handoff.yml" "$src/.github/workflows/build-handoff.yml"
          Copy-Item "requirements.txt" "$src/requirements.txt"
          Copy-Item "README.md" "$src/README.md"
          Copy-Item ".gitignore" "$src/.gitignore"
          $sha = (git rev-parse HEAD).Trim()
          @"
          김현수학 통합 성적표 + 개인별 오답 생성기 v1.1 전송안정판 전달 패키지

          이 압축파일 하나를 다음 수정 작업 때 올리면 됩니다.

          핵심 파일
          - 01_최신실행파일/김현수학_통합성적표_오답생성기.exe
          - 02_전체소스코드/combined/combined_app.py : 통합 GUI/회차선택/파일명 처리
          - 02_전체소스코드/combined/score/report4.py : 성적표 화면/색상/석차/숙제/그래프
          - 02_전체소스코드/combined/score/run3.py : 성적표 이미지/PDF/집계 생성 및 파일명
          - 02_전체소스코드/combined/score/parse4.py : 숙제/전체공지/개인공지 읽기
          - 02_전체소스코드/src/hwpx_direct.py : 학생별 HWPX 오답노트 생성
          - 02_전체소스코드/src/excel_reader.py : 오답노트용 Excel 읽기
          - 02_전체소스코드/.github/workflows/build-combined.yml : Windows EXE 자동빌드

          현재 주요 동작
          - XLSX + HWPX 드래그 입력
          - 회차 복수 선택
          - 성적표 + 학생별 오답노트 동시 생성
          - EXE 자기재실행 제거(다른 PC 보안차단/빈 결과 완화)
          - 번들 Chromium 제거, 설치된 Microsoft Edge/Chrome 사용
          - 오답노트 A4 세로
          - 1회차 전체 문항 정답률 표시
          - 숙제 4=매우잘함, 3=잘함, 2=부족함, 1=미제출
          - 성적표 석차는 총 응시 인원 미표시
          - 평가영역 그래프의 본인/반평균 표시를 서로 다른 모양으로 구분
          - 반평균보다 20점 이상 낮은 학생은 성적표 이미지 이름 끝에 x 표시
          - 오답노트 파일명에는 x를 붙이지 않음

          GitHub 저장소
          https://github.com/kimhyun004q-code/kimhyun-wrong-answer

          패키지 기준 커밋
          $sha
          "@ | Set-Content "$root/다음수정시_먼저읽기.txt" -Encoding UTF8
          "Repository: https://github.com/kimhyun004q-code/kimhyun-wrong-answer`nCommit: $sha" | Set-Content "$root/버전정보.txt" -Encoding UTF8
          Compress-Archive -Path "$root/*" -DestinationPath "김현수학_통합성적표_오답생성기_전체소스_실행파일.zip" -CompressionLevel Optimal

      - name: Upload handoff ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kimhyun-full-handoff
          path: 김현수학_통합성적표_오답생성기_전체소스_실행파일.zip
          retention-days: 30
          if-no-files-found: error

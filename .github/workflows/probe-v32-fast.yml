name: Probe V32 Fast Core

on:
  push:
    branches: [gpt-to-hwpx-build]
    paths: ['.github/workflows/probe-v32-fast.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild V32 source
        shell: pwsh
        run: |
          Set-Content rebuild.py -Encoding utf8 -Value @'
          import base64,gzip
          parts=[]
          for i in range(4):
              s=open(f'gpt_to_hwpx_build/v32gz_{i:02d}.b64',encoding='utf-8-sig').read().strip()
              parts.append(base64.b64decode(s))
          blob=b''.join(parts)
          open('v32.py.gz','wb').write(blob)
          src=gzip.decompress(blob)
          open('v32.py','wb').write(src)
          print('rebuilt bytes',len(blob),len(src))
          '@
          python rebuild.py
      - name: Probe functions
        shell: pwsh
        run: |
          python -c "import ast; s=open('v32.py',encoding='utf-8').read(); t=ast.parse(s); print('FUNCTIONS'); print('\n'.join(n.name for n in t.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)))); print('CLASSES'); print('\n'.join(n.name for n in t.body if isinstance(n,ast.ClassDef)))"
          Select-String -Path v32.py -Pattern 'def main|def convert|def build|def write|if __name__|template|clipboard|output' -Context 2,4

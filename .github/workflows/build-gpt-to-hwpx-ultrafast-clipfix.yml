name: Build GPT HWPX UltraFast Clipboard Fix

on:
  push:
    branches: [gpt-to-hwpx-build]
    paths: ['.github/workflows/build-gpt-to-hwpx-ultrafast-clipfix.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore latest ultrafast sources and template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null
          python -c "import base64,gzip,pathlib; p=pathlib.Path; p('app/ultrafast_app.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/app.gz.b64').read_bytes()))); p('app/ultrafast_core.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/core.gz.b64').read_bytes()))); p('app/ultrafast_tikz.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/tikz.gz.b64').read_bytes())))"
          python -c "import base64,pathlib; p=pathlib.Path; parts=sorted(p('gpt_to_hwpx_build').glob('template_*.b64')); p('app/direct_hwpx_template.hwpx').write_bytes(base64.b64decode(''.join(x.read_text().strip() for x in parts)))"

      - name: Patch clipboard ctypes for 64-bit Windows
        shell: pwsh
        run: |
          Set-Content app/patch_clipboard.py -Encoding utf8 -Value @'
          from pathlib import Path
          p=Path('app/ultrafast_app.py')
          s=p.read_text(encoding='utf-8')
          needle="u=ctypes.windll.user32; k=ctypes.windll.kernel32\n"
          patch="""u=ctypes.windll.user32; k=ctypes.windll.kernel32
              # 64-bit Windows safety: ctypes defaults pointer returns to c_int unless specified.
              u.OpenClipboard.argtypes=[ctypes.c_void_p]; u.OpenClipboard.restype=ctypes.c_bool
              u.CloseClipboard.argtypes=[]; u.CloseClipboard.restype=ctypes.c_bool
              u.GetClipboardData.argtypes=[ctypes.c_uint]; u.GetClipboardData.restype=ctypes.c_void_p
              k.GlobalLock.argtypes=[ctypes.c_void_p]; k.GlobalLock.restype=ctypes.c_void_p
              k.GlobalUnlock.argtypes=[ctypes.c_void_p]; k.GlobalUnlock.restype=ctypes.c_bool
          """
          if 'GetClipboardData.restype=ctypes.c_void_p' not in s:
              if needle not in s: raise SystemExit('clipboard patch anchor not found')
              s=s.replace(needle,patch,1)
          p.write_text(s,encoding='utf-8')
          print('64-bit clipboard patch applied')
          '@
          python app/patch_clipboard.py
          python -m py_compile app/ultrafast_app.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pymupdf

      - name: Source clipboard smoke test
        shell: pwsh
        run: |
          Set-Clipboard -Value '클립보드 64비트 테스트'
          Push-Location app
          python -c "import ultrafast_app as a; x=a.clipboard_text(); assert '클립보드 64비트 테스트' in x,repr(x); print('CLIPBOARD SOURCE OK')"
          Pop-Location

      - name: Create regression sample
        shell: pwsh
        run: |
          Set-Content app/sample.txt -Encoding utf8 -Value @'
          [정답] ① -4
          [해설]
          함수 $h(x)=f(x)g(x)$의 극한을 구한다.
          $$
          \lim_{x\to -2} h(x)=4
          $$
          점 $A$와 점 $B$를 잇는 선분 $AB$를 생각한다.
          변수 $a,b,n,x$는 그대로 둔다.
          '@

      - name: Regression test source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path outsrc | Out-Null
          Push-Location app
          python ultrafast_app.py --test-input sample.txt --output-dir ../outsrc --no-open --validate
          Pop-Location
          python -c "import zipfile,xml.etree.ElementTree as E,pathlib; p=next(pathlib.Path('outsrc').glob('*.hwpx')); z=zipfile.ZipFile(p); r=E.fromstring(z.read('Contents/section0.xml')); ns={'hp':'http://www.hancom.co.kr/hwpml/2011/paragraph'}; paras=[''.join(t.text or '' for t in q.findall('.//hp:t',ns)) for q in r.findall('.//hp:p',ns)]; scripts=[s.text or '' for s in r.findall('.//hp:script',ns)]; j='\\n'.join(scripts); assert paras[0].strip()=='[정답] ①',paras[:3]; assert 'lim _{x rarrow -2}' in j,j; assert 'rm A it' in j and 'rm B it' in j and 'rm AB it' in j,j; print('REGRESSION OK')"

      - name: Build corrected EXEs
        shell: pwsh
        run: |
          $tpl=(Resolve-Path 'app/direct_hwpx_template.hwpx').Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GPT_HWPX_초고속_수정 --distpath dist_onefile --workpath build_onefile --add-data "$tpl;." app/ultrafast_app.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name GPT_HWPX_초고속_FAST_수정 --distpath dist_fast --workpath build_fast --add-data "$tpl;." app/ultrafast_app.py

      - name: EXE clipboard smoke test
        shell: pwsh
        run: |
          Set-Clipboard -Value '[정답] ② -3`n[해설]`n함수 $f(x)=x$를 생각한다.'
          $p=Start-Process '.\dist_fast\GPT_HWPX_초고속_FAST_수정\GPT_HWPX_초고속_FAST_수정.exe' -ArgumentList @('--no-open') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "FAST clipboard smoke failed: $($p.ExitCode)"}
          Set-Clipboard -Value '[정답] ③ 7`n[해설]`n$x\to 1$일 때를 생각한다.'
          $p2=Start-Process '.\dist_onefile\GPT_HWPX_초고속_수정.exe' -ArgumentList @('--no-open') -Wait -PassThru
          if($p2.ExitCode -ne 0){throw "ONEFILE clipboard smoke failed: $($p2.ExitCode)"}
          Write-Host 'EXE CLIPBOARD SMOKE OK'

      - name: End-to-end file test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $p=Start-Process '.\dist_onefile\GPT_HWPX_초고속_수정.exe' -ArgumentList @('--test-input','app/sample.txt','--output-dir','out','--no-open','--validate') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "onefile exit $($p.ExitCode)"}
          $o=Get-ChildItem 'out\*.hwpx'|Select-Object -First 1
          Copy-Item $o.FullName 'out/GPT_HWPX_초고속_수정_테스트.hwpx' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_UltraFast_ClipboardFix_Windows
          path: |
            dist_onefile/GPT_HWPX_초고속_수정.exe
            dist_fast/GPT_HWPX_초고속_FAST_수정/**
            out/GPT_HWPX_초고속_수정_테스트.hwpx
          if-no-files-found: error
          retention-days: 7

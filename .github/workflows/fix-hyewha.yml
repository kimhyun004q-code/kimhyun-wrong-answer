name: Fix Hyewha HWPX

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-hyewha.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download inputs from Drive
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 'https://drive.usercontent.google.com/download?id=1-j6brGYWqtDAPzLYP9tIiZ2n6-BH9xHb&export=download&confirm=t' -o hyewha_current.hwpx
          curl -L --fail --retry 2 'https://drive.usercontent.google.com/download?id=17Tkiox6-pwpXXb4hhBimjx7XyUxwqZ9j&export=download&confirm=t' -o p11crop.png
          ls -lh hyewha_current.hwpx p11crop.png
          file hyewha_current.hwpx p11crop.png
          python - <<'PY'
          import zipfile
          from PIL import Image
          assert zipfile.is_zipfile('hyewha_current.hwpx'), 'HWPX download is not a ZIP'
          Image.open('p11crop.png').verify()
          print('INPUTS_OK')
          PY

      - name: Install Python deps
        run: pip install lxml pillow

      - name: Replace graph and add five-line problem gaps
        shell: bash
        run: |
          python - <<'PY'
          import io, os, re, zipfile
          from lxml import etree
          from PIL import Image

          src='hyewha_current.hwpx'; crop='p11crop.png'
          os.makedirs('output', exist_ok=True)
          out='output/기출의 현장_대구혜화여고_2학년_2026_1학기중간_대수_해설미주완성_원본그림_문항간격5줄.hwpx'

          with zipfile.ZipFile(src,'r') as zin:
              infos=zin.infolist(); data={i.filename:zin.read(i.filename) for i in infos}
          secname=next(n for n in data if n.endswith('section0.xml'))
          hdrname=next(n for n in data if n.endswith('header.xml'))
          parser=etree.XMLParser(remove_blank_text=False)
          sec=etree.fromstring(data[secname],parser); hdr=etree.fromstring(data[hdrname],parser)
          def ln(e): return etree.QName(e).localname
          def txt(p): return ''.join((t.text or '') for t in p.iter() if ln(t)=='t').strip()
          paras=[p for p in sec.iter() if ln(p)=='p']

          # Locate the problem whose statement says the graph is shown below.
          ti=None
          for i,p in enumerate(paras):
              s=txt(p).replace(' ','')
              if '그래프가다음그림과같다' in s:
                  ti=i; break
          if ti is None:
              raise RuntimeError('graph question not found')

          # Locate the nearest embedded picture reference around that question.
          ref=None
          for j in range(max(0,ti-2), min(len(paras),ti+12)):
              for e in paras[j].iter():
                  for k,v in e.attrib.items():
                      if etree.QName(k).localname=='binaryItemIDRef':
                          ref=v; break
                  if ref: break
              if ref: break
          if not ref: raise RuntimeError('graph binaryItemIDRef not found')

          href=None
          for e in hdr.iter():
              if e.attrib.get('id')==ref:
                  href=e.attrib.get('href') or e.attrib.get('fileRef') or e.attrib.get('path')
                  if href: break
          if href:
              href=href.lstrip('./')
              if href not in data and 'BinData/'+href in data: href='BinData/'+href
          else:
              cands=[n for n in data if n.startswith('BinData/') and (os.path.splitext(os.path.basename(n))[0]==ref or ref in os.path.basename(n))]
              if not cands: raise RuntimeError(f'cannot map {ref} to BinData')
              href=cands[0]
          if href not in data: raise RuntimeError(f'BinData file missing: {href}')

          # Replace the existing graph bytes with the crop taken directly from the original PDF.
          ext=os.path.splitext(href)[1].lower(); im=Image.open(crop)
          b=io.BytesIO()
          if ext in ('.jpg','.jpeg'):
              im.convert('RGB').save(b,'JPEG',quality=98,subsampling=0)
          elif ext=='.bmp': im.convert('RGB').save(b,'BMP')
          else: im.save(b,'PNG')
          old=len(data[href]); data[href]=b.getvalue()
          print('GRAPH_REPLACED',ref,href,old,len(data[href]))

          # Create blank paragraphs based on an existing choice-row paragraph.
          def blank_like(p):
              q=etree.Element(p.tag,attrib=dict(p.attrib))
              run=next((c for c in p if ln(c)=='run'),None)
              if run is not None:
                  r=etree.Element(run.tag,attrib=dict(run.attrib))
                  ts=next((x for x in run.iter() if ln(x)=='t'),None)
                  tag=ts.tag if ts is not None else '{%s}t'%etree.QName(run).namespace
                  t=etree.Element(tag); t.text=' '; r.append(t); q.append(r)
              return q

          added=0
          for p in list(paras):
              s=txt(p)
              if '④' in s and '⑤' in s:
                  par=p.getparent(); pos=par.index(p)
                  for k in range(4): par.insert(pos+1+k,blank_like(p)); added+=1
          for p in list(sec.iter()):
              if ln(p)=='p' and re.match(r'^\[서답형\s*[234]\]$',txt(p)):
                  par=p.getparent(); pos=par.index(p)
                  for k in range(4): par.insert(pos+k,blank_like(p)); added+=1
          print('BLANKS_ADDED',added)

          data[secname]=etree.tostring(sec,xml_declaration=True,encoding='UTF-8')
          etree.fromstring(data[secname])
          with zipfile.ZipFile(out,'w') as zout:
              for info in infos: zout.writestr(info,data[info.filename])
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              etree.fromstring(z.read(secname))
              assert z.read(href)==data[href]
          print('OUTPUT_OK',out,os.path.getsize(out))
          PY

      - name: Commit fixed HWPX
        shell: bash
        run: |
          git config user.name 'ChatGPT HWPX Fixer'
          git config user.email 'actions@users.noreply.github.com'
          git add output/*.hwpx
          git commit -m 'Add fixed Hyewha algebra HWPX [skip ci]'
          git push

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyewha-algebra-fixed
          path: output/*.hwpx
          if-no-files-found: error
          retention-days: 30

name: Build GPT HWPX UltraFast Relation Spacing Fix

on:
  push:
    branches: [gpt-to-hwpx-build]
    paths: ['.github/workflows/build-gpt-to-hwpx-ultrafast-relationspacing.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore latest ultrafast sources and template
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app | Out-Null
          python -c "import base64,gzip,pathlib; p=pathlib.Path; p('app/ultrafast_app.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/app.gz.b64').read_bytes()))); p('app/ultrafast_core.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/core.gz.b64').read_bytes()))); p('app/ultrafast_tikz.py').write_bytes(gzip.decompress(base64.b64decode(p('gpt_hwpx_ultrafast_fixed/tikz.gz.b64').read_bytes())))"
          python -c "import base64,pathlib; p=pathlib.Path; parts=sorted(p('gpt_to_hwpx_build').glob('template_*.b64')); p('app/direct_hwpx_template.hwpx').write_bytes(base64.b64decode(''.join(x.read_text().strip() for x in parts)))"

      - name: Patch 64-bit clipboard
        shell: pwsh
        run: |
          Set-Content app/patch_clipboard.py -Encoding utf8 -Value @'
          from pathlib import Path
          p=Path('app/ultrafast_app.py')
          s=p.read_text(encoding='utf-8')
          needle="u=ctypes.windll.user32; k=ctypes.windll.kernel32\n"
          patch="""u=ctypes.windll.user32; k=ctypes.windll.kernel32
              u.OpenClipboard.argtypes=[ctypes.c_void_p]; u.OpenClipboard.restype=ctypes.c_bool
              u.CloseClipboard.argtypes=[]; u.CloseClipboard.restype=ctypes.c_bool
              u.GetClipboardData.argtypes=[ctypes.c_uint]; u.GetClipboardData.restype=ctypes.c_void_p
              k.GlobalLock.argtypes=[ctypes.c_void_p]; k.GlobalLock.restype=ctypes.c_void_p
              k.GlobalUnlock.argtypes=[ctypes.c_void_p]; k.GlobalUnlock.restype=ctypes.c_bool
          """
          if 'GetClipboardData.restype=ctypes.c_void_p' not in s:
              if needle not in s: raise SystemExit('clipboard anchor not found')
              s=s.replace(needle,patch,1)
          p.write_text(s,encoding='utf-8')
          '@
          python app/patch_clipboard.py

      - name: Patch geometry labels to Roman
        shell: pwsh
        run: |
          Set-Content app/patch_roman.py -Encoding utf8 -Value @'
          from pathlib import Path
          p=Path('app/ultrafast_core.py')
          s=p.read_text(encoding='utf-8')
          a=s.index('def normalize_geometry_text(text: str) -> str:')
          b=s.index('\ndef romanize_math_labels',a)
          new=r'''def normalize_geometry_text(text: str) -> str:
              """Normalize geometry labels while preserving ordinary variables/functions."""
              text=text.replace('⊥', r'\\perp').replace('∥', r'\\parallel')
              text=re.sub(r'∠\s*([A-Z]{1,6})', lambda m:r'\\angle '+m.group(1), text)
              text=re.sub(r'\^\s*\{\s*\\(?:circ|degree)\s*\}', r'^{circ}', text)
              text=re.sub(r'\^\s*\\(?:circ|degree)\b', r'^{circ}', text)
              nouns=r'(점|삼각형|사각형|오각형|육각형|선분|직선|반직선|평면|원)'
              text=re.sub(nouns+r'\s+\$\s*([A-Z]{1,6})\s*\$', lambda m:m.group(1)+' $\\mathrm{'+m.group(2)+'}$', text)
              text=re.sub(nouns+r'\s+\\\(\s*([A-Z]{1,6})\s*\\\)', lambda m:m.group(1)+r' \(' + r'\\mathrm{'+m.group(2)+'}' + r'\)', text)
              text=re.sub(nouns+r'\s+`\s*([A-Z]{1,6})\s*`', lambda m:m.group(1)+' `\\mathrm{'+m.group(2)+'}`', text)
              text=re.sub(nouns+r'\s+\[\[INLINE_EQ\]\]\s*([A-Z]{1,6})\s*\[\[/INLINE_EQ\]\]', lambda m:m.group(1)+' [[INLINE_EQ]]\\mathrm{'+m.group(2)+'}[[/INLINE_EQ]]', text)
              text=re.sub(nouns+r'\s+([A-Z]{1,6})(?![A-Za-z0-9])', lambda m:m.group(1)+' `\\mathrm{'+m.group(2)+'}`', text)
              return text
          '''
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')
          '@
          python app/patch_roman.py

      - name: Patch relation glyphs and spacing
        shell: pwsh
        run: |
          Set-Content app/patch_relations.py -Encoding utf8 -Value @'
          from pathlib import Path
          p=Path('app/ultrafast_core.py')
          s=p.read_text(encoding='utf-8')
          anchor="    s = s.replace('&nbsp;', ' ')\n"
          addition=r'''    # Normalize every equality/inequality as a relation token with explicit HWP math spacing.
              # This keeps chained relations such as 289 < 300 = (10 sqrt 3)^2 < 324 visually even.
              s = s.replace('&lt;', '<').replace('&gt;', '>').replace('＜', '<').replace('＞', '>')
              s = s.replace('≤', '@@LEQ@@').replace('≥', '@@GEQ@@').replace('≠', '@@NEQ@@')
              s = re.sub(r'\\(?:leqslant|leq|le)\b', '@@LEQ@@', s)
              s = re.sub(r'\\(?:geqslant|geq|ge)\b', '@@GEQ@@', s)
              s = re.sub(r'\\(?:neq|ne)\b', '@@NEQ@@', s)
              s = re.sub(r'\\(?:lt|less)\b', '@@LT@@', s)
              s = re.sub(r'\\(?:gt|greater)\b', '@@GT@@', s)
              s = re.sub(r'(?<![<>=!])<=', '@@LEQ@@', s)
              s = re.sub(r'(?<![<>=!])>=', '@@GEQ@@', s)
              s = re.sub(r'!=', '@@NEQ@@', s)
              # Strict signs and equality are handled last so <=, >=, != are not split apart.
              s = re.sub(r'\s*<\s*', '@@LT@@', s)
              s = re.sub(r'\s*>\s*', '@@GT@@', s)
              s = re.sub(r'\s*=\s*', '@@EQ@@', s)
              for key,val in (
                  ('@@LEQ@@',' ~LEQ~ '), ('@@GEQ@@',' ~GEQ~ '), ('@@NEQ@@',' ~neq~ '),
                  ('@@LT@@',' ~<~ '), ('@@GT@@',' ~>~ '), ('@@EQ@@',' ~=~ ')):
                  s=s.replace(key,val)
          '''
          if anchor not in s: raise SystemExit('relation anchor not found')
          s=s.replace(anchor,anchor+addition,1)
          s=s.replace("        r'\\geq':'>=', r'\\ge':'>=', r'\\leq':'<=', r'\\le':'<=', r'\\neq':'!=', r'\\ne':'!=', r'\\approx':'APPROX',",
                      "        r'\\geq':'~GEQ~', r'\\ge':'~GEQ~', r'\\leq':'~LEQ~', r'\\le':'~LEQ~', r'\\neq':'~neq~', r'\\ne':'~neq~', r'\\approx':'APPROX',")
          s=s.replace("        '≤':'<=','≥':'>=','≠':'!=','→':'rarrow','⇒':'RARROW','⇔':'LRARROW','↔':'LRARROW',",
                      "        '≤':'~LEQ~','≥':'~GEQ~','≠':'~neq~','→':'rarrow','⇒':'RARROW','⇔':'LRARROW','↔':'LRARROW',")
          p.write_text(s,encoding='utf-8')
          '@
          python app/patch_relations.py
          python -m py_compile app/ultrafast_core.py app/ultrafast_app.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pymupdf

      - name: Relation spacing regression test
        shell: pwsh
        run: |
          Set-Content app/sample.txt -Encoding utf8 -Value @'
          [정답] ①
          [해설]
          여기서
          $17^2 = 289 < 300 = (10\sqrt{3})^2 < 324 = 18^2$
          이므로
          $17 < 10\sqrt{3} < 18$
          또한 $-2 \le x \leq \frac{3}{2}$, $a \ge b$, $p \neq q$이다.
          '@
          New-Item -ItemType Directory -Force -Path outsrc | Out-Null
          Push-Location app
          python ultrafast_app.py --test-input sample.txt --output-dir ../outsrc --no-open --validate
          Pop-Location
          python -c "import zipfile,xml.etree.ElementTree as E,pathlib; p=next(pathlib.Path('outsrc').glob('*.hwpx')); z=zipfile.ZipFile(p); r=E.fromstring(z.read('Contents/section0.xml')); ns={'hp':'http://www.hancom.co.kr/hwpml/2011/paragraph'}; scripts=[s.text or '' for s in r.findall('.//hp:script',ns)]; j='\\n'.join(scripts); assert '~<~' in j,j; assert '~=~' in j,j; assert '~LEQ~' in j,j; assert '~GEQ~' in j,j; assert '~neq~' in j,j; assert '<=' not in j and '>=' not in j,j; print('RELATION SPACING REGRESSION OK'); print(j)"

      - name: Build EXEs
        shell: pwsh
        run: |
          $tpl=(Resolve-Path 'app/direct_hwpx_template.hwpx').Path
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GPT_HWPX_초고속_관계기호간격수정 --distpath dist_onefile --workpath build_onefile --add-data "$tpl;." app/ultrafast_app.py
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name GPT_HWPX_초고속_FAST_관계기호간격수정 --distpath dist_fast --workpath build_fast --add-data "$tpl;." app/ultrafast_app.py

      - name: EXE smoke and end-to-end test
        shell: pwsh
        run: |
          Set-Clipboard -Value '[해설] $17^2 = 289 < 300 = (10\sqrt{3})^2 < 324 = 18^2$'
          $p=Start-Process '.\dist_fast\GPT_HWPX_초고속_FAST_관계기호간격수정\GPT_HWPX_초고속_FAST_관계기호간격수정.exe' -ArgumentList @('--no-open') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "FAST smoke failed: $($p.ExitCode)"}
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $p=Start-Process '.\dist_onefile\GPT_HWPX_초고속_관계기호간격수정.exe' -ArgumentList @('--test-input','app/sample.txt','--output-dir','out','--no-open','--validate') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "onefile exit $($p.ExitCode)"}
          $o=Get-ChildItem 'out\*.hwpx'|Select-Object -First 1
          Copy-Item $o.FullName 'out/GPT_HWPX_관계기호간격수정_테스트.hwpx' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GPT_HWPX_UltraFast_RelationSpacingFix_Windows
          path: |
            dist_onefile/GPT_HWPX_초고속_관계기호간격수정.exe
            dist_fast/GPT_HWPX_초고속_FAST_관계기호간격수정/**
            out/GPT_HWPX_관계기호간격수정_테스트.hwpx
          if-no-files-found: error
          retention-days: 7

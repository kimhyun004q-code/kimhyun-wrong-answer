name: Build Test Score Tool EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "score_tool/**"
      - ".github/workflows/build-score-tool.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r score_tool/requirements.txt

      - name: Build single EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "김현수학_시험성적자동입력기" `
            --collect-all tkinterdnd2 `
            --paths score_tool `
            score_tool/app.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "dist\김현수학_시험성적자동입력기.exe"
          if (-not (Test-Path $exe)) { throw "EXE build missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: kimhyun-test-score-tool
          path: dist/김현수학_시험성적자동입력기.exe
          if-no-files-found: error
          retention-days: 30
